name: build-awass
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/awass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add Android platform
        run: |
          flutter create --platforms=android --project-name awass _scaffold
          cp -r _scaffold/android ./android
          rm -rf _scaffold
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Awass"#' android/app/src/main/AndroidManifest.xml
      - name: Fix known version conflicts
        run: |
          sed -i -E 's/^([[:space:]]*intl:).*/\1 any/' pubspec.yaml
      - name: Get packages
        run: flutter pub get || flutter pub upgrade --major-versions
      - name: Signing key (created once, then reused for every build)
        run: |
          KS="$GITHUB_WORKSPACE/keystores/awass.jks"
          PWF="$GITHUB_WORKSPACE/keystores/awass.pass"
          mkdir -p "$GITHUB_WORKSPACE/keystores"
          if [ ! -f "$KS" ]; then
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KS" -alias key -keyalg RSA -keysize 2048 -validity 36500 -storepass "$PW" -keypass "$PW" -dname "CN=awass, O=apk apps, C=SA"
            echo "$PW" > "$PWF"
            git -C "$GITHUB_WORKSPACE" config user.name apk-apps
            git -C "$GITHUB_WORKSPACE" config user.email apk-apps@users.noreply.github.com
            git -C "$GITHUB_WORKSPACE" add keystores
            git -C "$GITHUB_WORKSPACE" commit -m "apk apps: signing key for awass"
            git -C "$GITHUB_WORKSPACE" push
          fi
      - run: flutter build apk --release
      - name: Sign APK with the fixed key
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          PW=$(cat "$GITHUB_WORKSPACE/keystores/awass.pass")
          "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/keystores/awass.jks" --ks-pass pass:"$PW" --key-pass pass:"$PW" --out build/app/outputs/flutter-apk/awass.apk build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/awass.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: awass-${{ github.run_number }}
          name: awass build ${{ github.run_number }}
          files: apps/awass/build/app/outputs/flutter-apk/awass.apk
