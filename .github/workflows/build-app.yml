name: build-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Capacitor project
        run: |
          mkdir -p cap/www
          cp index.html style.css app.js cap/www/
          cd cap
          echo '{"name":"apk-apps","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.apkapps.app","appName":"apk apps","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: cap/android
        run: ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-apps-${{ github.run_number }}
          name: apk apps ${{ github.run_number }}
          files: cap/android/app/build/outputs/apk/debug/app-debug.apk
