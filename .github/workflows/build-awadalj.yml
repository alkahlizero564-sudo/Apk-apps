name: build-awadalj
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/awadalj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add Android platform
        run: |
          flutter create --platforms=android --project-name awadalj _scaffold
          cp -r _scaffold/android ./android
          rm -rf _scaffold
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Awadalj"#' android/app/src/main/AndroidManifest.xml
      - name: Apply app icon (if provided)
        run: |
          if [ -d app_icon ]; then cp -r app_icon/mipmap-* android/app/src/main/res/; fi
      - name: Fix known version conflicts
        run: |
          sed -i -E 's/^([[:space:]]*intl:).*/\1 any/' pubspec.yaml
      - name: Fix known API renames
        run: |
          find lib -name '*.dart' -exec sed -i -E 's/\bCardTheme\(/CardThemeData(/g; s/\bDialogTheme\(/DialogThemeData(/g; s/\bTabBarTheme\(/TabBarThemeData(/g; s/\bColors\.gray\b/Colors.grey/g' {} +
      - name: Get packages
        run: |
          set -o pipefail
          (flutter pub get || flutter pub upgrade --major-versions) 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Signing key (created once, then reused for every build)
        run: |
          KS="$GITHUB_WORKSPACE/keystores/awadalj.jks"
          PWF="$GITHUB_WORKSPACE/keystores/awadalj.pass"
          mkdir -p "$GITHUB_WORKSPACE/keystores"
          if [ ! -f "$KS" ]; then
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KS" -alias key -keyalg RSA -keysize 2048 -validity 36500 -storepass "$PW" -keypass "$PW" -dname "CN=awadalj, O=apk apps, C=SA"
            echo "$PW" > "$PWF"
            git -C "$GITHUB_WORKSPACE" config user.name apk-apps
            git -C "$GITHUB_WORKSPACE" config user.email apk-apps@users.noreply.github.com
            git -C "$GITHUB_WORKSPACE" add keystores
            git -C "$GITHUB_WORKSPACE" commit -m "apk apps: signing key for awadalj"
            git -C "$GITHUB_WORKSPACE" push
          fi
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Sign APK with the fixed key
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          PW=$(cat "$GITHUB_WORKSPACE/keystores/awadalj.pass")
          "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/keystores/awadalj.jks" --ks-pass pass:"$PW" --key-pass pass:"$PW" --out build/app/outputs/flutter-apk/awadalj.apk build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/awadalj.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: awadalj-${{ github.run_number }}
          name: awadalj build ${{ github.run_number }}
          files: apps/awadalj/build/app/outputs/flutter-apk/awadalj.apk
      - name: Save build errors for the app (auto-fix)
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          OUT="$GITHUB_WORKSPACE/build-logs/awadalj-${{ github.run_id }}.txt"
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          if [ -f "$LOG" ]; then
            grep -E -B1 -A4 'Error:|error:|What went wrong|Because |version solving failed|Could not|Unresolved' "$LOG" | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | head -c 12000 > "$OUT" || true
          fi
          [ -s "$OUT" ] || echo "NO_DART_ERRORS" > "$OUT"
          git -C "$GITHUB_WORKSPACE" config user.name apk-apps
          git -C "$GITHUB_WORKSPACE" config user.email apk-apps@users.noreply.github.com
          git -C "$GITHUB_WORKSPACE" add build-logs
          git -C "$GITHUB_WORKSPACE" commit -m "apk apps: build errors awadalj" || true
          git -C "$GITHUB_WORKSPACE" pull --rebase || true
          git -C "$GITHUB_WORKSPACE" push || true
